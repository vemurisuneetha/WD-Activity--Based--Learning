<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Registration and Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6e6fa;
            text-align: center;
        }

        form {
            background-color: white;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            color: darkblue;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
        }

        input, textarea, select {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        input:focus, textarea:focus, select:focus {
            outline: 2px solid blue;
            border-color: blue;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkblue;
        }

        a {
            color: blue;
        }

        p {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>User Account Website</h1>

    <!-- Registration Form -->
    <form id="registerForm">
        <h2>Registration</h2>

        <label for="name">Full Name:</label>
        <input type="text" id="name" required
               minlength="2" placeholder="Enter your name">

        <label for="email">Email:</label>
        <input type="email" id="email" required
               placeholder="Enter your email">

        <label for="password">Password:</label>
        <input type="password" id="password" required
               minlength="8" placeholder="Minimum 8 characters">

        <label for="confirm">Confirm Password:</label>
        <input type="password" id="confirm" required
               placeholder="Confirm password">

        <button type="submit">Register</button>

        <p id="registerMessage" role="status"></p>

        <p>Already registered? <a href="#login">Login</a></p>
    </form>


    <!-- Login Form -->
    <form id="loginForm">
        <h2>Login</h2>

        <label for="loginEmail">Email:</label>
        <input type="email" id="loginEmail" required
               placeholder="Enter your email">

        <label for="loginPassword">Password:</label>
        <input type="password" id="loginPassword" required
               placeholder="Enter your password">

        <button type="submit">Login</button>

        <p id="loginMessage" role="status"></p>

        <p><a href="#forgot">Forgot Password?</a></p>
    </form>


    <!-- Password Recovery Form -->
    <form id="forgotForm">
        <h2>Forgot Password</h2>

        <label for="forgotEmail">Email:</label>
        <input type="email" id="forgotEmail" required
               placeholder="Enter your email">

        <button type="submit">Reset Password</button>

        <p id="forgotMessage" role="status"></p>
    </form>


    <!-- Profile Setup Form -->
    <form id="profileForm">
        <h2>Profile Setup</h2>

        <label for="profileName">Full Name:</label>
        <input type="text" id="profileName" required
               placeholder="Enter your name">

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" required
               pattern="[0-9]{10}" maxlength="10"
               placeholder="10-digit phone number">

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>

        <label for="bio">About Me:</label>
        <textarea id="bio" rows="3"
                  placeholder="Write about yourself"></textarea>

        <button type="submit">Save Profile</button>

        <p id="profileMessage" role="status"></p>
    </form>

</body>
</html>
